name: 'Tauri Build'
on:
  push:
    branches:
      - build
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: 'macos-14'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsndfile1

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Dynamic Sidecars
        run: node scripts/setup-sidecars.cjs
        env:
          TARGET_TRIPLE: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pyinstaller librosa soundfile

      - name: Build Python Sidecars
        run: |
          pyinstaller --onefile --distpath src-tauri --name bpm_detector-${{ matrix.target }} src-python/bpm_detector.py
          pyinstaller --onefile --distpath src-tauri --name bpm_modifier-${{ matrix.target }} src-python/bpm_modifier.py
        env:
          TARGET_TRIPLE: ${{ matrix.target }}

      - name: Verify sidecars
        shell: bash
        run: |
          set -euo pipefail
          for binary in ffmpeg ffprobe yt-dlp node bpm_detector bpm_modifier; do
            path="src-tauri/${binary}-${{ matrix.target }}${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}"
            test -s "$path"
            if [[ "${{ matrix.target }}" != "x86_64-pc-windows-msvc" ]]; then
              chmod +x "$path"
            fi
          done
          if [[ "${{ matrix.target }}" == *"apple-darwin" ]]; then
            file src-tauri/bpm_detector-${{ matrix.target }}
            file src-tauri/bpm_modifier-${{ matrix.target }}
          fi

      - name: Load Release Notes
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log -n 10 --pretty=format:"- %s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          fi

          {
            echo 'RELEASE_BODY<<EOF'
            cat CHANGELOG.md 2>/dev/null || echo "No manual patchnotes provided."
            echo ""
            echo "### Commit History"
            echo "$COMMITS"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      # Tauri memanggil NPM script "tauri build" secara otomatis di dalam action
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # aksi ini otomatis menarik versi dari tauri.conf.json
          releaseName: 'ElToolkit Update v__VERSION__'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
