<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading ElToolkit...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --appbg: #FFFBF5;
            --ink: #4A3E54;
            --oshipink: #FF6FA0;
            --toska: #2FD9C0;
            --softpink: #FFEBF1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .splash-card {
            width: 270px;
            height: 350px;
            background-color: var(--appbg);
            border: 6px solid var(--ink);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 14px 0 0 var(--ink);
            position: relative;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            overflow: hidden;
        }

        /* Diagonal stripes background pattern */
        .splash-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                -45deg,
                var(--softpink),
                var(--softpink) 10px,
                transparent 10px,
                transparent 20px
            );
            opacity: 0.8;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .icon-container {
            width: 100px;
            height: 100px;
            background-color: #FFFFFF;
            border: 4px solid var(--ink);
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 6px 0 0 var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: float 3s ease-in-out infinite;
        }

        .icon-container img {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }

        .title {
            color: var(--ink);
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px var(--toska);
        }

        .badge {
            margin-top: 8px;
            background-color: var(--oshipink);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 999px;
            border: 3px solid var(--ink);
            box-shadow: 0 3px 0 0 var(--ink);
        }

        .loading-bar-container {
            width: 75%;
            height: 16px;
            background-color: #FFFFFF;
            border: 3px solid var(--ink);
            border-radius: 999px;
            margin-top: 36px;
            position: relative;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background-color: var(--toska);
            border-right: 3px solid var(--ink);
            animation: loadProgress 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            position: relative;
        }
        
        /* Shimmer effect on loading bar */
        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1s infinite linear;
        }

        .loading-text {
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 800;
            color: var(--ink);
            text-transform: uppercase;
            animation: blink 1s infinite;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            30% { width: 45%; }
            60% { width: 70%; }
            100% { width: 100%; }
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="content-wrapper">
            <div class="icon-container">
                <img src="/splash_icon.png" alt="App Icon" />
            </div>
            <h1 class="title">ElToolkit</h1>
            <div class="badge">JOGJA REDI</div>
            
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <div class="loading-text">LOADING SYSTEM...</div>
        </div>
    </div>
</body>
</html>
